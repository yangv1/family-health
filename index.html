<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家族健康檔案庫</title>

<!-- ══════════════════════════════════════════════════════
     字型載入
══════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════
   CSS 變數（色彩、圓角、陰影）
   修改主色調只需改這裡
══════════════════════════════════════════════════════ */
:root {
  --bg:           #f7f4ef;
  --surface:      #ffffff;
  --surface2:     #f0ece4;
  --border:       #e2dbd0;
  --text:         #2c2419;
  --text-muted:   #7a6e62;
  --accent:       #7c4f2f;
  --accent-light: #c8956a;
  --accent-bg:    #f5ede4;
  --green:        #3a6b4a;
  --green-bg:     #e8f2eb;
  --red:          #a03030;
  --red-bg:       #f5e8e8;
  --yellow:       #7a6020;
  --yellow-bg:    #f5f0dc;
  --blue:         #2d5a8a;
  --blue-bg:      #e8f0f8;
  --shadow:       0 2px 12px rgba(44,36,25,0.08);
  --shadow-lg:    0 8px 32px rgba(44,36,25,0.12);
  --radius:       12px;
}

/* ══════════════════════════════════════════════════════
   全域 Reset & Base
══════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* ══════════════════════════════════════════════════════
   Header
══════════════════════════════════════════════════════ */
.header {
  background: var(--accent);
  color: white;
  padding: 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 16px rgba(124,79,47,0.25);
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.header h1 {
  font-family: 'Noto Serif TC', serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.header-sub { font-size: 11px; opacity: 0.7; margin-top: 2px; }
.header-right { display: flex; align-items: center; gap: 8px; }
.btn-admin {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  transition: background 0.2s;
}
.btn-admin:hover { background: rgba(255,255,255,0.25); }
.admin-badge {
  background: rgba(255,220,150,0.25);
  border: 1px solid rgba(255,220,150,0.5);
  color: #ffe9a0;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  display: none;
}

/* ══════════════════════════════════════════════════════
   Navigation
══════════════════════════════════════════════════════ */
.nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 56px;
  z-index: 90;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.nav-inner {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  padding: 0 24px;
}
.nav-tab {
  padding: 11px 15px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
  user-select: none;
}
.nav-tab:hover { color: var(--accent); }
.nav-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 500;
}

/* ══════════════════════════════════════════════════════
   Main Container
══════════════════════════════════════════════════════ */
.main {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px;
}

/* ══════════════════════════════════════════════════════
   頁面顯示控制
══════════════════════════════════════════════════════ */
.page { display: none; }
.page.active { display: block; }

/* ══════════════════════════════════════════════════════
   管理員面板（登入後顯示）
══════════════════════════════════════════════════════ */
.admin-panel {
  display: none;
  background: #2c2419;
  color: #e8dfd0;
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 20px;
  font-size: 12px;
}
.admin-panel h3 { color: #c8956a; font-size: 13px; margin-bottom: 10px; }
.admin-panel-desc { color: #a89880; margin-bottom: 10px; }
.visibility-grid { display: flex; gap: 10px; flex-wrap: wrap; }
.vis-item {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 5px 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: background 0.2s;
}
.vis-item:hover { background: rgba(255,255,255,0.1); }

/* ══════════════════════════════════════════════════════
   資訊區塊（近期行程、待追蹤）
══════════════════════════════════════════════════════ */
.info-box {
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 16px;
}
.info-box.upcoming { background: var(--blue-bg); border: 1px solid #8ab4d8; }
.info-box.alert    { background: var(--yellow-bg); border: 1px solid #d4b860; }
.info-box h3 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.info-box.upcoming h3 { color: var(--blue); }
.info-box.alert h3    { color: var(--yellow); }
.info-row {
  font-size: 12px;
  padding: 5px 0;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.info-row:last-child { border-bottom: none; }
.info-row .date { font-weight: 600; min-width: 56px; color: var(--blue); }
.info-row .name { font-weight: 500; min-width: 28px; }
.info-row.alert-row .name { color: var(--yellow); font-weight: 600; }

/* ══════════════════════════════════════════════════════
   成員卡片格（總覽頁）
══════════════════════════════════════════════════════ */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 14px;
}
.member-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 14px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  box-shadow: var(--shadow);
  position: relative;
}
.member-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  border-color: var(--accent-light);
}
.member-card.has-alert { border-color: #e8a042; }
.member-avatar { font-size: 36px; margin-bottom: 8px; }
.member-name   { font-weight: 600; font-size: 15px; }
.member-id     { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.alert-dot {
  position: absolute;
  top: 10px; right: 10px;
  width: 8px; height: 8px;
  background: #e8a042;
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:0.6; transform:scale(1.3); }
}

/* ══════════════════════════════════════════════════════
   成員頁：頁頭
══════════════════════════════════════════════════════ */
.page-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 22px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow);
}
.page-avatar { font-size: 46px; }
.page-title  { font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 700; }
.page-meta   { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.page-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
.badge-red    { background: var(--red-bg);    color: var(--red);        }
.badge-blue   { background: var(--blue-bg);   color: var(--blue);       }
.badge-accent { background: var(--accent-bg); color: var(--accent);     }
.badge-gray   { background: var(--surface2);  color: var(--text-muted); }

/* ══════════════════════════════════════════════════════
   Section 卡片（可折疊）
══════════════════════════════════════════════════════ */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.section-header {
  padding: 13px 18px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.section-header:hover { background: #e8e2d8; }
.section-toggle { margin-left: auto; font-size: 11px; color: var(--text-muted); }
.section-body.collapsed { display: none; }

/* ══════════════════════════════════════════════════════
   照顧指南（Care Guide）
══════════════════════════════════════════════════════ */
.care-item {
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.care-item:last-child { border-bottom: none; }
.care-icon   { font-size: 18px; min-width: 22px; text-align: center; margin-top: 1px; }
.care-title  { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.care-detail { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
.care-dates  { margin-top: 6px; font-size: 11px; display: flex; gap: 16px; flex-wrap: wrap; }
.care-date-label { color: var(--text-muted); }
.care-date-val   { font-weight: 500; margin-left: 3px; }
.care-date-val.upcoming { color: var(--blue); font-weight: 600; }
.imp-high::before { content:'🔴'; margin-right:4px; }
.imp-mid::before  { content:'🟡'; margin-right:4px; }

/* ══════════════════════════════════════════════════════
   用藥清單（Medication）
══════════════════════════════════════════════════════ */
.med-schedule-banner {
  background: var(--accent-bg);
  padding: 10px 18px;
  font-size: 12px;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  line-height: 1.8;
}
.med-item {
  padding: 11px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.med-item:last-child { border-bottom: none; }
.med-status {
  min-width: 50px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
  text-align: center;
  margin-top: 2px;
  white-space: nowrap;
}
.status-active  { background: var(--green-bg); color: var(--green);       }
.status-stopped { background: var(--surface2); color: var(--text-muted);  }
.status-pending { background: var(--yellow-bg); color: var(--yellow);     }
.med-name   { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.med-detail { font-size: 12px; color: var(--text-muted); line-height: 1.55; }
.med-tags   { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
.med-tag    { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--surface2); color: var(--text-muted); }
.stopped-toggle {
  padding: 8px 18px;
  background: var(--surface2);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
}
.stopped-toggle:hover { color: var(--accent); }
.stopped-body { display: none; }

/* ══════════════════════════════════════════════════════
   時間軸（Timeline）
══════════════════════════════════════════════════════ */
.timeline { padding: 8px 0; }
.tl-item {
  display: flex;
  padding: 0 18px;
  cursor: pointer;
}
.tl-left {
  width: 76px; min-width: 76px;
  text-align: right;
  padding-right: 12px;
  padding-top: 13px;
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.3;
  flex-shrink: 0;
}
.tl-line {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 18px;
}
.tl-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent-light);
  margin-top: 15px;
  flex-shrink: 0;
  border: 2px solid var(--surface);
  box-shadow: 0 0 0 2px var(--accent-light);
}
.tl-dot.alert { background: #e8a042; box-shadow: 0 0 0 2px #e8a042; }
.tl-connector { width: 2px; flex: 1; background: var(--border); min-height: 8px; }
.tl-content {
  flex: 1;
  padding: 9px 10px 9px 12px;
  margin: 5px 0;
  border-radius: 8px;
  transition: background 0.15s;
}
.tl-item:hover .tl-content,
.tl-item.expanded .tl-content { background: var(--surface2); }
.tl-title { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.tl-meta  { font-size: 11px; color: var(--text-muted); }
.tl-tags  { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.tl-tag   { font-size: 10px; padding: 1px 6px; border-radius: 8px; }
/* 事件類型顏色 */
.type-診 { background: var(--blue-bg);   color: var(--blue);   }
.type-藥 { background: var(--green-bg);  color: var(--green);  }
.type-檢 { background: var(--accent-bg); color: var(--accent); }
.type-症 { background: var(--yellow-bg); color: var(--yellow); }
.type-追 { background: var(--red-bg);    color: var(--red);    }
/* 展開詳細 */
.tl-expand {
  display: none;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.7;
}
.tl-item.expanded .tl-expand { display: block; }

/* ══════════════════════════════════════════════════════
   Empty State
══════════════════════════════════════════════════════ */
.empty { text-align: center; padding: 32px; color: var(--text-muted); font-size: 13px; }

/* ══════════════════════════════════════════════════════
   Auth Modal
══════════════════════════════════════════════════════ */
.auth-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(44,36,25,0.55);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.auth-overlay.open { display: flex; }
.auth-box {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 30px;
  max-width: 300px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}
.auth-icon  { font-size: 36px; margin-bottom: 10px; }
.auth-title { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.auth-sub   { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
.auth-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 20px;
  text-align: center;
  letter-spacing: 0.4em;
  margin-bottom: 10px;
  font-family: 'Noto Sans TC', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
.auth-input:focus { border-color: var(--accent); }
.auth-btn {
  width: 100%;
  padding: 10px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 500;
}
.auth-btn:hover { opacity: 0.88; }
.auth-error  { color: var(--red); font-size: 12px; margin-top: 8px; display: none; }
.auth-cancel { margin-top: 12px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
.auth-cancel:hover { color: var(--accent); }

/* ══════════════════════════════════════════════════════
   Responsive
══════════════════════════════════════════════════════ */
@media (max-width: 600px) {
  .main { padding: 14px; }
  .dashboard-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .tl-left { width: 58px; min-width: 58px; }
  .header h1 { font-size: 16px; }
  .page-avatar { font-size: 38px; }
  .page-title  { font-size: 19px; }
}

/* ══════════════════════════════════════════════════════
   v2 新增：過期回診日期標示、其他身體狀況、紅字異常標記
══════════════════════════════════════════════════════ */
.care-date-val.expired { color: var(--red); font-weight: 600; }
.flag-high { color: #dc2626; font-weight: 600; }
.obs-item { display: grid; grid-template-columns: 76px 1fr; gap: 10px;
            padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9em; }
.obs-item:last-child { border-bottom: none; }
.obs-date { color: var(--text-muted); font-size: 0.88em; padding-top: 1px; }
.obs-action { color: var(--accent); font-size: 0.85em; margin-top: 3px; }
</style>
<body>

<!-- ══════════════════════════════════════════════════════
     HEADER（最後更新日期由 JS 從 DATA_SNAPSHOT.lastUpdate 產生）
══════════════════════════════════════════════════════ -->
<div class="header">
  <div class="header-inner">
    <div>
      <h1>🏥 家族健康檔案庫</h1>
      <div class="header-sub" id="lastUpdateText"></div>
    </div>
    <div class="header-right">
      <span class="admin-badge" id="adminBadge">🔑 管理員</span>
      <button class="btn-admin" id="adminBtn" onclick="App.auth.showModal()">管理員</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════
     NAVIGATION（分頁由 JS 依 members 產生）
══════════════════════════════════════════════════════ -->
<div class="nav">
  <div class="nav-inner" id="navInner"></div>
</div>

<!-- ══════════════════════════════════════════════════════
     MAIN（總覽與各成員頁由 JS 依 DATA_SNAPSHOT 產生）
══════════════════════════════════════════════════════ -->
<div class="main" id="mainContainer">

  <!-- 管理員面板（登入後顯示；隱藏成員選項由 JS 產生） -->
  <div class="admin-panel" id="adminPanel">
    <h3>🔑 管理員設定</h3>
    <div class="admin-panel-desc">隱藏成員可見性控制</div>
    <div class="visibility-grid" id="visibilityGrid"></div>
  </div>

  <!-- 頁面容器：JS 渲染注入點 -->

</div><!-- /main -->


<!-- ══════════════════════════════════════════════════════
     管理員登入 Modal
══════════════════════════════════════════════════════ -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <div class="auth-icon">🔑</div>
    <div class="auth-title">管理員登入</div>
    <div class="auth-sub">請輸入管理員密碼</div>
    <input class="auth-input" id="authInput" type="password" maxlength="6" placeholder="••••"
           onkeydown="if(event.key==='Enter') App.auth.tryLogin()">
    <button class="auth-btn" onclick="App.auth.tryLogin()">確認</button>
    <div class="auth-error" id="authError">密碼錯誤，請再試一次</div>
    <div class="auth-cancel" onclick="App.auth.hideModal()">取消</div>
  </div>
</div>


<!-- ══════════════════════════════════════════════════════
     DATA_SNAPSHOT（v2 結構化資料 — 全站唯一資料來源）

     用途：
       1. 頁面載入時由 JS 讀取並動態渲染全部內容
       2. 下次更新時由 Claude 讀取現有資料，只查詢增量

     更新規則：
       - 所有內容修改只改這份 JSON，不動渲染程式與樣式
       - lastUpdate = 當次改動 HTML 的日期（header 顯示自動同步）
       - 事件依 date 自動排序（新→舊），無需手動排列
       - 近期行程、待追蹤事項、成員卡警示均由資料自動衍生

     欄位標準（v2.1）：
       members[]     id / page / name / avatar / badges[] / metaSuffix / emptyText / hidden
       events[]      member / date(ISO排序用) / dateDisplay(顯示覆寫，選填) / title / meta
                     type(看診紀錄|用藥變化|檢查結果|症狀觀察) / followUp / followUpTag / followUpNote

    },
    {
      "member": "M02",
      "date": "長期",
      "text": "媽屁股痠痛（薦椎往尾骨內側肌群緊張導致）",
      "action": "7/17圓典推拿處置：做薦椎肌肉鬆動（梨狀肌、閉孔內肌等）"
    }
  ]
}</script>


<!-- ══════════════════════════════════════════════════════
     JAVASCRIPT
     架構：App 物件，各功能分模組

     App.render      ── 由 DATA_SNAPSHOT 動態渲染全部內容
     App.auth        ── 管理員認證（登入 Modal）
     App.nav         ── 分頁切換
     App.section     ── Section 折疊 / 舊用藥展開
     App.timeline    ── 時間軸事件展開
     App.visibility  ── 隱藏成員可見性控制

     修改管理員密碼：更改 CONFIG.ADMIN_PASSWORD
     修改資料：只改上方 DATA_SNAPSHOT，勿改本區
══════════════════════════════════════════════════════ -->
<script>
/* ── 設定區 ── */
const CONFIG = {
  ADMIN_PASSWORD: '4982',
  DEFAULT_PAGE:   'dashboard',
};

/* ── 資料載入 ── */
const DATA = JSON.parse(document.getElementById('DATA_SNAPSHOT').textContent);

/* ── App 主物件 ── */
const App = {

  /* ────────────────────────────────
     render：由 DATA_SNAPSHOT 產生全部畫面
     所有版型規則集中於此，資料只負責內容
  ──────────────────────────────── */
  render: {

    /* 工具：日期格式 */
    fmt: {
      slash(iso) {                       /* 2026-08-20 → 2026/8/20 */
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
        return m ? `${m[1]}/${+m[2]}/${+m[3]}` : (iso || '');
      },
      md(iso) {                          /* 2026-08-20 → 8/20 */
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
        return m ? `${+m[2]}/${+m[3]}` : (iso || '');
      },
      cjk(iso) {                         /* 2026-07-13 → 2026年7月13日 */
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
        return m ? `${m[1]}年${+m[2]}月${+m[3]}日` : (iso || '');
      },
    },

    /* 對照表：事件類型 → 標籤 */
    TYPE_TAGS: {
      '看診紀錄': { cls: 'type-診', text: '看診' },
      '用藥變化': { cls: 'type-藥', text: '用藥變化' },
      '檢查結果': { cls: 'type-檢', text: '檢查結果' },
      '症狀觀察': { cls: 'type-症', text: '症狀觀察' },
    },
    IMP_CLASS: { '高': 'imp-high', '中': 'imp-mid', '低': 'imp-low' },

    /* 資料查詢（date="長期" 視為最舊，固定排在時間軸最下方） */
    sortKey(d)    { return /^\d{4}/.test(d || '') ? d : '0000'; },
    eventsOf(id)  { return DATA.events.filter(e => e.member === id)
                      .sort((a, b) => this.sortKey(b.date).localeCompare(this.sortKey(a.date))); },
    medsOf(id)    { return DATA.medications.filter(m => m.member === id); },
    obsOf(id)     { return (DATA.observations || []).filter(o => o.member === id)
                      .sort((a, b) => this.sortKey(b.date).localeCompare(this.sortKey(a.date))); },
    careOf(id)    { return DATA.careGuide.filter(c => c.member === id); },
    schedOf(id)   { const s = (DATA.schedules || []).find(s => s.member === id); return s || null; },
    memberById(id){ return DATA.members.find(m => m.id === id); },
    hasAlert(id)  {
      return DATA.events.some(e => e.member === id && e.followUp) ||
             (DATA.pending || []).some(p => p.member === id && p.level === 'alert');
    },
    isExpired(d)  { return d && d < DATA.lastUpdate; },

    /* ── Nav 分頁 ── */
    nav() {
      const tabs = ['<div class="nav-tab active" data-page="dashboard">🏠 總覽</div>'];
      DATA.members.forEach(m => {
        const cls   = 'nav-tab' + (m.hidden ? ' hidden-member' : '');
        const extra = m.hidden ? ` data-member="${m.page}" style="display:none"` : '';
        tabs.push(`<div class="${cls}" data-page="${m.page}"${extra}>${m.avatar} ${m.name}</div>`);
      });
      document.getElementById('navInner').innerHTML = tabs.join('\n');
    },

    /* ── 管理員面板：隱藏成員選項 ── */
    adminPanel() {
      const items = DATA.members.filter(m => m.hidden).map(m =>
        `<label class="vis-item"><input type="checkbox" id="vis-${m.page}" onchange="App.visibility.toggle('${m.page}', this.checked)"> ${m.name}</label>`
      );
      document.getElementById('visibilityGrid').innerHTML = items.join('\n');
    },

    /* ── 總覽頁 ── */
    dashboard() {
      const f = this.fmt;
      /* 近期行程：careGuide 中 nextDate >= lastUpdate、成員可見，依日期升冪 */
      const upcoming = DATA.careGuide
        .filter(c => c.nextDate && c.nextDate >= DATA.lastUpdate)
        .filter(c => !(this.memberById(c.member) || {}).hidden)
        .sort((a, b) => a.nextDate.localeCompare(b.nextDate))
        .map(c => `<div class="info-row">
        <span class="date">${f.md(c.nextDate)}</span>
        <span class="name">${this.memberById(c.member).name}</span>
        <span>${c.upcomingText || c.title}</span>
      </div>`);

      /* 待追蹤事項：pending 中 level=alert、成員可見 */
      const alerts = (DATA.pending || [])
        .filter(p => p.level === 'alert')
        .filter(p => !(this.memberById(p.member) || {}).hidden)
        .map(p => `<div class="info-row alert-row">
        <span class="name">${this.memberById(p.member).name}</span>
        <span>${p.text}</span>
      </div>`);

      /* 成員卡片 */
      const cards = DATA.members.map(m => {
        const alert = this.hasAlert(m.id);
        return `<div class="member-card${alert ? ' has-alert' : ''}${m.hidden ? ' hidden-member' : ''}"${m.hidden ? ` data-member="${m.page}" style="display:none"` : ''} onclick="App.nav.go('${m.page}')">
        ${alert ? '<div class="alert-dot"></div>' : ''}
        <div class="member-avatar">${m.avatar}</div>
        <div class="member-name">${m.name}</div>
        <div class="member-id">${m.id}</div>
      </div>`;
      });

      return `<div class="page active" id="page-dashboard">
    <div class="info-box upcoming">
      <h3>📅 近期行程</h3>
      ${upcoming.join('\n      ') || '<div class="info-row"><span>目前無近期行程</span></div>'}
    </div>
    <div class="info-box alert">
      <h3>⚠️ 待追蹤事項</h3>
      ${alerts.join('\n      ') || '<div class="info-row"><span>目前無待追蹤事項</span></div>'}
    </div>
    <div class="dashboard-grid">
      ${cards.join('\n      ')}
    </div>
  </div>`;
    },

    /* ── 照顧指南 Section ── */
    careSection(items) {
      if (!items.length) return '';
      const f = this.fmt;
      const rows = items.map(c => {
        const dates = [];
        if (c.frequency) dates.push(`<span class="care-date-label">頻率</span><span class="care-date-val">${c.frequency}</span>`);
        if (c.lastDate)  dates.push(`<span class="care-date-label">上次</span><span class="care-date-val">${f.slash(c.lastDate)}</span>`);
        if (c.nextDate) {
          if (this.isExpired(c.nextDate)) {
            dates.push(`<span class="care-date-label">下次</span><span class="care-date-val expired">${f.slash(c.nextDate)}（已過期，下次回診時間待補）</span>`);
          } else {
            const note = c.nextNote ? `（${c.nextNote}）` : '';
            dates.push(`<span class="care-date-label">下次</span><span class="care-date-val upcoming">${f.slash(c.nextDate)}${note}</span>`);
          }
        }
        return `<div class="care-item">
          <div class="care-icon">${c.icon || '📌'}</div>
          <div>
            <div class="care-title ${this.IMP_CLASS[c.importance] || 'imp-mid'}">${c.title}</div>
            <div class="care-detail">${c.detail || ''}</div>
            ${dates.length ? `<div class="care-dates">${dates.join('\n              &nbsp;&nbsp;\n              ')}</div>` : ''}
          </div>
        </div>`;
      });
      return `<div class="section">
      <div class="section-header" onclick="App.section.toggle(this)">
        🗓️ 照顧指南 <span class="section-toggle">▲</span>
      </div>
      <div class="section-body">
        ${rows.join('\n        ')}
      </div>
    </div>`;
    },

    /* ── 用藥清單 Section ── */
    medItem(m) {
      const f = this.fmt;
      const active = m.status === '服用中';
      const tags = [];
      if (m.dept)          tags.push(m.dept);
      if (m.timingDisplay) tags.push(m.timingDisplay);
      if (active && m.startDate) tags.push(`開始 ${f.slash(m.startDate)}`);
      if (!active && m.stopDate) tags.push(`停藥 ${f.slash(m.stopDate)}`);
      const adjust = m.adjustNote
        ? `<br><span style="color:var(--accent);font-size:0.85em;">▸ ${m.adjustNote}</span>` : '';
      return `<div class="med-item">
          <div class="med-status ${active ? 'status-active' : 'status-stopped'}">${m.status}</div>
          <div>
            <div class="med-name">${m.name}</div>
            <div class="med-detail">${m.detail || ''}${adjust}</div>
            <div class="med-tags">${tags.map(t => `<span class="med-tag">${t}</span>`).join('')}</div>
          </div>
        </div>`;
    },

    medsSection(items, schedule) {
      if (!items.length) return '';
      const active  = items.filter(m => m.status === '服用中');
      const stopped = items.filter(m => m.status !== '服用中');
      const banner = schedule
        ? `<div class="med-schedule-banner">
          ⏰ <strong>服藥時間表</strong><br>
          ${schedule.lines.join('<br>\n          ')}
        </div>` : '';
      const stoppedHtml = stopped.length
        ? `<div class="stopped-toggle" onclick="App.section.toggleStopped(this)">
          ▼ 查看舊用藥（已停藥）
        </div>
        <div class="stopped-body">
          ${stopped.map(m => this.medItem(m)).join('\n          ')}
        </div>` : '';
      return `<div class="section">
      <div class="section-header" onclick="App.section.toggle(this)">
        💊 用藥清單 <span class="section-toggle">▲</span>
      </div>
      <div class="section-body">
        ${banner}
        ${active.map(m => this.medItem(m)).join('\n        ')}
        ${stoppedHtml}
      </div>
    </div>`;
    },

    /* ── 其他身體狀況 Section（時間｜情形｜處置；長期置底） ── */
    obsSection(items) {
      if (!items.length) return '';
      const f = this.fmt;
      const rows = items.map(o => `<div class="obs-item">
          <div class="obs-date">${o.dateDisplay || f.slash(o.date)}</div>
          <div>
            <div>${o.text}</div>
            ${o.action ? `<div class="obs-action">▸ ${o.action}</div>` : ''}
          </div>
        </div>`);
      return `<div class="section">
      <div class="section-header" onclick="App.section.toggle(this)">
        🩺 其他身體狀況 <span class="section-toggle">▲</span>
      </div>
      <div class="section-body">
        ${rows.join('\n        ')}
      </div>
    </div>`;
    },

    /* ── 事件時間軸 Section ── */
    labsTable(labs) {
      const cell = 'padding:4px 8px;';
      const flagStyle = { warn: 'color:var(--warning,#d97706);font-weight:600;', high: 'color:#dc2626;font-weight:600;' };
      const rows = labs.rows.map((r, i) => {
        const bg = i % 2 === 1 ? 'background:var(--surface2);' : '';
        const fs = r.flag ? flagStyle[r.flag] : '';
        return `<tr${bg ? ` style="${bg}"` : ''}><td style="${cell}">${r.item}</td><td style="${cell}${fs}">${r.result}</td><td style="${cell}">${r.unit}</td><td style="${cell}">${r.ref}</td></tr>`;
      });
      return `<strong>${labs.title}：</strong>
                <table style="width:100%;border-collapse:collapse;font-size:0.85em;margin-top:6px;margin-bottom:10px;">
                  <thead>
                    <tr style="background:var(--surface2);text-align:left;">
                      <th style="padding:4px 8px;border-bottom:1px solid var(--border);">檢驗項目</th>
                      <th style="padding:4px 8px;border-bottom:1px solid var(--border);">結果</th>
                      <th style="padding:4px 8px;border-bottom:1px solid var(--border);">單位</th>
                      <th style="padding:4px 8px;border-bottom:1px solid var(--border);">參考範圍</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${rows.join('\n                    ')}
                  </tbody>
                </table>
                ${labs.note ? `<div style="margin-bottom:10px;font-size:0.82em;color:var(--text-muted);">${labs.note}</div>` : ''}`;
    },

    timelineItem(ev) {
      const f = this.fmt;
      const typeTag = this.TYPE_TAGS[ev.type] || { cls: 'type-診', text: ev.type };
      const tags = [`<span class="tl-tag ${typeTag.cls}">${typeTag.text}</span>`];
      if (ev.followUp) tags.push(`<span class="tl-tag type-追">${ev.followUpTag || '待追蹤'}</span>`);
      const parts = [];
      if (ev.pre)  parts.push(`<div style="margin-bottom:8px;font-size:0.82em;color:var(--text-muted);"><strong>前情：</strong>${ev.pre}</div>`);
      if (ev.labs) parts.push(this.labsTable(ev.labs));
      if (ev.detail) parts.push(ev.detail);
      (ev.updates || []).slice()
        .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
        .forEach(u => parts.push(`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);"><strong>${u.title}：</strong>${u.text}</div>`));
      return `<div class="tl-item" onclick="App.timeline.toggle(this)">
            <div class="tl-left">${ev.dateDisplay || f.slash(ev.date)}</div>
            <div class="tl-line"><div class="tl-dot${ev.followUp ? ' alert' : ''}"></div><div class="tl-connector"></div></div>
            <div class="tl-content">
              <div class="tl-title">${ev.title}</div>
              <div class="tl-meta">${ev.meta || ''}</div>
              <div class="tl-tags">${tags.join('')}</div>
              <div class="tl-expand">${parts.join('\n                ')}</div>
            </div>
          </div>`;
    },

    timelineSection(events) {
      if (!events.length) return '';
      return `<div class="section">
      <div class="section-header" onclick="App.section.toggle(this)">
        📋 事件紀錄 <span class="section-toggle">▲</span>
      </div>
      <div class="section-body">
        <div class="timeline">
          ${events.map(e => this.timelineItem(e)).join('\n          ')}
        </div>
      </div>
    </div>`;
    },

    /* ── 成員頁 ── */
    memberPage(m) {
      const badges = (m.badges || []).map(b => `<span class="badge badge-${b.style}">${b.text}</span>`).join('\n          ');
      const care   = this.careSection(this.careOf(m.id));
      const meds   = this.medsSection(this.medsOf(m.id), this.schedOf(m.id));
      const obs    = this.obsSection(this.obsOf(m.id));
      const tl     = this.timelineSection(this.eventsOf(m.id));
      const hasContent = care || meds || obs || tl;
      const empty  = !hasContent ? `<div class="empty">${m.emptyText || '目前無任何資料'}</div>` : '';
      return `<div class="page" id="page-${m.page}">
    <div class="page-header">
      <div class="page-avatar">${m.avatar}</div>
      <div>
        <div class="page-title">${m.name}</div>
        <div class="page-meta">${m.id}${m.metaSuffix ? ' · ' + m.metaSuffix : ''}</div>
        ${badges ? `<div class="page-badges">\n          ${badges}\n        </div>` : ''}
      </div>
    </div>
    ${[care, meds, obs, tl].filter(Boolean).join('\n    ')}
    ${empty}
  </div>`;
    },

    /* ── 全站渲染入口 ── */
    all() {
      document.getElementById('lastUpdateText').textContent = '最後更新：' + this.fmt.cjk(DATA.lastUpdate);
      this.nav();
      this.adminPanel();
      const pages = [this.dashboard(), ...DATA.members.map(m => this.memberPage(m))];
      document.getElementById('mainContainer')
        .insertAdjacentHTML('beforeend', pages.join('\n\n  '));
    },
  },

  /* ────────────────────────────────
     auth：管理員認證
  ──────────────────────────────── */
  auth: {
    isAdmin: false,

    showModal() {
      document.getElementById('authOverlay').classList.add('open');
      document.getElementById('authInput').value = '';
      document.getElementById('authError').style.display = 'none';
      setTimeout(() => document.getElementById('authInput').focus(), 100);
    },

    hideModal() {
      document.getElementById('authOverlay').classList.remove('open');
    },

    tryLogin() {
      const val = document.getElementById('authInput').value;
      if (val === CONFIG.ADMIN_PASSWORD) {
        this.isAdmin = true;
        this.hideModal();
        document.getElementById('adminBadge').style.display = 'inline';
        document.getElementById('adminBtn').style.display   = 'none';
        document.getElementById('adminPanel').style.display = 'block';
      } else {
        document.getElementById('authError').style.display = 'block';
        document.getElementById('authInput').value = '';
        document.getElementById('authInput').focus();
      }
    },
  },

  /* ────────────────────────────────
     nav：分頁切換
     go(pageId)：切換到指定頁
  ──────────────────────────────── */
  nav: {
    current: CONFIG.DEFAULT_PAGE,

    go(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById('page-' + pageId);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.page === pageId);
      });

      this.current = pageId;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    init() {
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => App.nav.go(tab.dataset.page));
      });
    },
  },

  /* ────────────────────────────────
     section：Section 折疊 / 舊用藥展開
  ──────────────────────────────── */
  section: {
    /* 折疊 Section（點擊 section-header 時呼叫） */
    toggle(header) {
      const body   = header.nextElementSibling;
      const toggle = header.querySelector('.section-toggle');
      const isOpen = !body.classList.contains('collapsed');
      body.classList.toggle('collapsed', isOpen);
      toggle.textContent = isOpen ? '▼' : '▲';
    },

    /* 展開舊用藥（點擊 stopped-toggle 時呼叫）
       v2 修正：原版初始狀態判斷錯誤導致第一次點擊無效 */
    toggleStopped(el) {
      const body   = el.nextElementSibling;
      const isOpen = body.style.display === 'block';
      body.style.display = isOpen ? 'none' : 'block';
      el.textContent = isOpen ? '▼ 查看舊用藥（已停藥）' : '▲ 隱藏舊用藥';
    },
  },

  /* ────────────────────────────────
     timeline：時間軸事件展開
  ──────────────────────────────── */
  timeline: {
    toggle(item) {
      item.classList.toggle('expanded');
    },
  },

  /* ────────────────────────────────
     visibility：隱藏成員顯示控制
     toggle(member, show)：member 為 data-member 值
  ──────────────────────────────── */
  visibility: {
    toggle(member, show) {
      /* Nav tab */
      document.querySelectorAll(`.nav-tab[data-member="${member}"]`).forEach(el => {
        el.style.display = show ? '' : 'none';
      });
      /* 總覽成員卡片 */
      document.querySelectorAll(`.member-card[data-member="${member}"]`).forEach(el => {
        el.style.display = show ? '' : 'none';
      });
      /* 若目前正在隱藏頁，切回總覽 */
      if (!show && App.nav.current === member) {
        App.nav.go('dashboard');
      }
    },
  },

  /* ────────────────────────────────
     init：啟動
  ──────────────────────────────── */
  init() {
    this.render.all();
    this.nav.init();
  },
};

App.init();
</script>

</body>
</html>
